name: Offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check dedicated window and scoped shutdown
        shell: powershell
        run: ./scripts/check_desktop.ps1
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-test.txt -c requirements-lock.txt
      - run: python -m compileall -q studio scripts
      - name: Check PowerShell script syntax
        shell: pwsh
        run: |
          Get-ChildItem -Filter '*.ps1' | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - run: python scripts/check.py
      - run: python scripts/check_editorial.py
      - run: python scripts/check_api.py
      - run: python scripts/check_batches.py
      - run: python scripts/check_social.py
      - run: python scripts/check_cleanup.py
      - run: python scripts/check_planner.py
      - run: python scripts/check_desktop_window.py
      - run: python scripts/check_venv_paths.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
